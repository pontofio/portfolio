<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiona Pontoparia — Portfolio</title>

<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/nav.css">
<link rel="stylesheet" href="assets/css/sections.css">
<link rel="stylesheet" href="assets/css/cards.css">
<link rel="stylesheet" href="assets/css/timeline.css">
<link rel="stylesheet" href="assets/css/window.css">
<link rel="stylesheet" href="assets/css/form.css">
<link rel="stylesheet" href="assets/css/cursor.css">
</head>
<body>

<nav class="dock" id="nav" aria-label="Navigation principale"></nav>

<main id="app">
  <!-- Sections are rendered here by js/main.js from assets/data/content.js -->
</main>

<div class="overlay" id="overlay">
  <div class="window" id="window" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="titlebar">
      <span class="path"><span class="dot"></span><span id="win-path">fichier</span></span>
      <button class="close" id="closeBtn" aria-label="Fermer">✕</button>
    </div>
    <div class="window-body">
      <h3 id="win-title"></h3>
      <span class="tag" id="win-tag"></span>
      <p id="win-desc"></p>
      <div class="stack" id="win-stack"></div>
    </div>
  </div>
</div>

<footer class="hint">clique sur un élément — échap ou ✕ pour fermer</footer>

<!-- Content data (plain global variable, no fetch — works via file://) -->
<script src="assets/data/content.js"></script>

<!-- Modules, in dependency order. No type="module": plain scripts open
     fine by double-clicking index.html, no local server required. -->
<script src="assets/js/modules/dom.js"></script>
<script src="assets/js/modules/contentLoader.js"></script>
<script src="assets/js/modules/navRenderer.js"></script>
<script src="assets/js/modules/scrollSpy.js"></script>
<script src="assets/js/modules/sectionRenderers.js"></script>
<script src="assets/js/modules/windowController.js"></script>
<script src="assets/js/modules/customCursor.js"></script>
<script src="assets/js/modules/emailSenders/EmailSender.js"></script>
<script src="assets/js/modules/emailSenders/ConsoleEmailSender.js"></script>
<script src="assets/js/modules/emailSenders/FormspreeSender.js"></script>
<script src="assets/js/modules/emailSenders/EmailJSSender.js"></script>
<script src="assets/js/modules/contactForm.js"></script>

<!-- Composition root: wires everything together -->
<script src="assets/js/main.js"></script>
</body>
</html>
